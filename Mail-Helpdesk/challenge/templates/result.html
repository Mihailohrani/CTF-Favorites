<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submission Result — IT Helpdesk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #eceef1;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f1f1f;
      color: #d8d8d8;
      padding: 12px 28px;
      font-size: 13px;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    header .badge {
      background: #3a3a3a;
      color: #aaa;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    header .timestamp {
      font-size: 11px;
      color: #666;
      font-variant-numeric: tabular-nums;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 72px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d0d3d8;
      border-radius: 4px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      overflow: hidden;
      animation: slideUp 0.25s ease both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: #f7f8f9;
      border-bottom: 1px solid #d0d3d8;
      padding: 20px 28px 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header h1 {
      font-size: 17px;
      font-weight: 600;
      color: #111;
      margin-bottom: 3px;
    }

    .card-header p {
      font-size: 12px;
      color: #888;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eaf4ee;
      border: 1px solid #b7dcc4;
      color: #2d7a4f;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .status-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a9e62;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .card-body {
      padding: 28px 28px 24px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #777;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ebebeb;
    }

    pre {
      background: #181a1b;
      color: #c9d1d9;
      font-family: "Courier New", Courier, monospace;
      font-size: 12.5px;
      line-height: 1.65;
      padding: 16px 18px;
      border-radius: 3px;
      border: 1px solid #2a2d2e;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      background: #2e3135;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 2px;
      font-size: 10px;
      font-family: inherit;
      padding: 3px 8px;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover { background: #3c4045; color: #ddd; }
    .copy-btn.copied { background: #2d4a35; color: #6dcf8c; border-color: #3a6b47; }

    .pre-wrap { position: relative; }

    .card-footer {
      background: #f7f8f9;
      border-top: 1px solid #d0d3d8;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-link {
      font-size: 13px;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
      padding: 6px 0;
    }

    .back-link svg {
      transition: transform 0.15s;
    }

    .back-link:hover {
      color: #4a7aad;
    }

    .back-link:hover svg {
      transform: translateX(-3px);
    }

    .back-link:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(74,122,173,0.3);
      border-radius: 2px;
    }

    .footer-note {
      font-size: 11px;
      color: #bbb;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      padding: 14px;
      border-top: 1px solid #d8d8d8;
      background: #e4e6ea;
    }

    @media (max-width: 480px) {
      .card-body { padding: 20px 18px; }
      .card-header, .card-footer { padding-left: 18px; padding-right: 18px; }
      .card-header { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92V19a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 10.8a19.79 19.79 0 0 1-3-8.58A2 2 0 0 1 3 0h2.09a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L6.91 7.09a16 16 0 0 0 6 6l.38-.38a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 20 15h2.92z"/>
    </svg>
    IT Helpdesk &mdash; Support Portal
    <span class="badge">Internal</span>
  </div>
  <span class="timestamp" id="live-clock"></span>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <div>
        <h1>Submission Result</h1>
        <p>The request has been processed by the mail handler.</p>
      </div>
      <div class="status-pill">
        <span class="dot"></span>
        Processed
      </div>
    </div>

    <div class="card-body">

      <div class="section">
        <div class="section-label">Server Response</div>
        <div class="pre-wrap">
          <button class="copy-btn" data-target="result-pre">Copy</button>
          <pre id="result-pre">{{ result }}</pre>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Command Used</div>
        <div class="pre-wrap">
          <button class="copy-btn" data-target="cmd-pre">Copy</button>
          <pre id="cmd-pre">{{ cmd }}</pre>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <a class="back-link" href="/">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to form
      </a>
    </div>
  </div>
</main> 

<script>
  (function () {
    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
      const el = document.getElementById('live-clock');
      const now = new Date();
      if (el) el.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }
    updateClock();
    setInterval(updateClock, 1000);

    document.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        navigator.clipboard.writeText(target.textContent.trim()).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 2000);
        });
      });
    });
  })();
</script>

</body>
</html>
